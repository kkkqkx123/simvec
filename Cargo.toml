[package]
name = "simvec"
version = "0.1.0"
edition = "2021"
description = "Local vector search engine: exact scan, mmap storage, WAL"
license = "Apache-2.0"

[lib]
name = "simvec"
path = "src/lib.rs"

[features]
# Compile in adjacency/list write-lock wait instrumentation. Off by
# default so the hot mutation paths carry no timing overhead; enable for
# lock-contention investigations (metrics flow through MetricsSnapshot).
lock-metrics = []
# Portable SIMD via `std::simd` (`portable_simd`, still unstable on stable
# Rust as of 1.97; `#86656`). When enabled, `distance::portable` delegates
# to `naive` as a stable placeholder until `std::simd` stabilizes or the
# `wide` crate is adopted. The kernel `Portable` variant remains in the
# dispatch ranking for differential bench wiring. Evaluation branch:
# compare against hand-written AVX2/AVX512 kernels within 1e-4; gate merged
# until bench shows >10% gain.
simd_portable = []

[dependencies]
utoipa = "5.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
postcard = { version = "1.1", features = ["use-std"] }
thiserror = "2.0.17"
parking_lot = "0.12"
rayon = "1.10.0"
memmap2 = "0.9.5"
bitvec = "1.0"
arc-swap = "1.7"
tracing = "0.1"
chrono = { version = "0.4.38", features = ["serde"] }
crc32fast = "1.5"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time"] }
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3.23.0"
rand = "0.8.5"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "vector_scan_bench"
harness = false

[[bench]]
name = "ivf_bench"
harness = false

[[bench]]
name = "hnsw_build_bench"
harness = false

[[bench]]
name = "hnsw_ingest_bench"
harness = false

[[bench]]
name = "concurrent_search_bench"
harness = false

[[bench]]
name = "alloc_stats_bench"
harness = false

[[bench]]
name = "persist_crc_bench"
harness = false

[[bench]]
name = "distance_bench"
harness = false
