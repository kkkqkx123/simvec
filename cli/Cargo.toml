[package]
name = "simvec-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Interactive command-line shell for simvec"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "2"

[[bin]]
name = "simvec"
path = "src/main.rs"

[lib]
name = "simvec_cli"
path = "src/lib.rs"

[dependencies]
simvec = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
