# cbindgen configuration for the simvec C API.
#
# Regeneration (requires cbindgen on PATH):
#   cargo build --features c_api
# The build script re-runs cbindgen only when the feature is enabled and
# the binary exists; otherwise the committed include/simvec.h is kept.

language = "C"

include_guard = "SIMVEC_H"

cpp_compat = true

autogen_warning = "/* Generated by cbindgen from src/c_api. DO NOT EDIT. */"

sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]

[export]
# The error enum only appears as integer codes in signatures,
# so it is forced out explicitly like linkrs does for its own codes.
include = ["simvec_error_code_t"]
